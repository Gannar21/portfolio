name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:          # Allow manual trigger from GitHub UI

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false   # Let an in-progress deploy finish first

jobs:
  # ── 1. Build ────────────────────────────────────────────────────────────────
  build:
    name: Lint, Type-check & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Build static site
        run: npm run build
        env:
          # Repo is at gannar21.github.io/portfolio — so basePath must be /portfolio
          NEXT_PUBLIC_BASE_PATH: /portfolio
          NEXT_PUBLIC_SITE_URL: https://gannar21.github.io/portfolio

          # Your contact email — set this in GitHub → Settings → Secrets → Actions
          # Name it exactly: NEXT_PUBLIC_CONTACT_EMAIL
          # Formsubmit uses this address to deliver form submissions. No API key needed.
          NEXT_PUBLIC_CONTACT_EMAIL: ${{ secrets.NEXT_PUBLIC_CONTACT_EMAIL }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  # ── 2. Deploy ────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
